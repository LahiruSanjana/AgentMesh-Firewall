listen_addr: "127.0.0.1:9999"
downstream_url: "http://127.0.0.1:9000/mcp"
policy_path: "pkg/policy/agent_mesh.rego"
rate_limit_per_minute: 60
downstream_timeout: 10s
max_request_body_bytes: 1048576
max_response_body_bytes: 4194304
read_header_timeout: 5s
read_timeout: 30s
write_timeout: 30s
idle_timeout: 60s
identities:
  - agent_id: "agent-local"
    tenant_id: "tenant-local"
    # Generate with: agentmesh hash-token <token>
    token_hash: "replace-with-sha256-token-hash"
    status: "ACTIVE"
    trust_score: 90
    allowed_scopes: ["tools/list", "tools/call", "resources/read"]
    expires_at: "2099-01-01T00:00:00Z"
